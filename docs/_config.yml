# FieldPad: HVAC Service Pro - Website Configuration
# GitHub Pages Jekyll Configuration

title: "FieldPad: HVAC CRM for Solo Techs"
description: "Customer records, service jobs, estimates, invoices and equipment history for solo HVAC operators. Local records support work without a signal. Public version 1.0.1; optional connected 1.1 features are under validation."
url: "https://fieldpadpro.com"
baseurl: ""
lang: "en-US"

# Company Info
author: "Huggler Holdings LLC"
email: "fieldpad@fieldpadpro.com"

# App Store availability (set to true when app is live on the App Store)
app_store_live: true

# Build Settings
markdown: kramdown
highlighter: rouge
permalink: pretty

# Collections
collections:
  articles:
    output: true
    permalink: /articles/:slug/
  tools:
    output: true
    permalink: /tools/:slug/

# Default front matter
defaults:
  - scope:
      path: ""
      type: "articles"
    values:
      layout: "article"
      author: "FieldPad Team"
  - scope:
      path: ""
      type: "tools"
    values:
      layout: "tool"
      author: "FieldPad Team"

# Plugins (GitHub Pages supported)
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

# Exclude from build
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENSE

# SEO
twitter:
  card: summary_large_image
social:
  name: "FieldPad: HVAC Service Pro"
  links: []

# Google Search Console verification.
# Use the "HTML tag" method in Search Console (https://search.google.com/search-console),
# copy the content="..." token from the <meta name="google-site-verification"> tag,
# then uncomment the line below and paste the token. jekyll-seo-tag emits the meta tag automatically.
# (If you verify with the "Domain" property type instead, use a DNS TXT record — leave this commented.)
# google_site_verification: "PASTE_TOKEN_HERE"

# Timezone
timezone: America/Chicago
