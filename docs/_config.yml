# FieldPad: HVAC Service Pro - Website Configuration
# GitHub Pages Jekyll Configuration

title: "FieldPad: HVAC CRM for Solo Techs"
description: "The all-in-one HVAC CRM and business management app built for solo technicians. Clients, scheduling, estimates, invoices with signatures, inventory, and equipment history — on your iPhone, offline-ready, at a fraction of Jobber and Housecall Pro. EPA Section 608 and Subpart C compliance included."
url: "https://fieldpadpro.com"
baseurl: ""
lang: "en-US"

# Company Info
author: "Huggler Holdings LLC"
email: "fieldpad@fieldpadpro.com"

# App Store availability (set to true when app is live on the App Store)
app_store_live: true

# Build Settings
markdown: kramdown
highlighter: rouge
permalink: pretty

# Collections
collections:
  articles:
    output: true
    permalink: /articles/:slug/

# Default front matter
defaults:
  - scope:
      path: ""
      type: "articles"
    values:
      layout: "article"
      author: "FieldPad Team"

# Plugins (GitHub Pages supported)
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

# Exclude from build
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENSE

# SEO
twitter:
  card: summary_large_image
social:
  name: "FieldPad: HVAC Service Pro"
  links: []

# Google verification (placeholder - update with actual)
# google_site_verification: "YOUR_VERIFICATION_CODE"

# Timezone
timezone: America/Chicago
